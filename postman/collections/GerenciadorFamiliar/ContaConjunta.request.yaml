$kind: http-request
name: Criar ContaConjunta
url: "{{baseUrl}}/api/ContaConjunta"
method: POST
body:
  type: json
  content: "{\r\n  \"nome\": \"Casa Rotta\",\r\n  \"descricao\": \"Conta de familia\"\r\n}"
scripts:
  - type: afterResponse
    code: "const r = pm.response.json();\r\nif (pm.response.code === 201) {\r\n  pm.collectionVariables.set('contaConjuntaId', r.id);\r\n  console.log('contaConjuntaId salvo:', r.id);\r\n} else {\r\n  console.log('Erro criar conta conjunta:', pm.response.status, JSON.stringify(r));\r\n}"
    language: text/javascript
order: 20
