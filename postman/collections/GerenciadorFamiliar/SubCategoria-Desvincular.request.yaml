$kind: http-request
name: Desvincular SubCategoria
url: "{{baseUrl}}/api/SubCategoria/desvincular"
method: POST
body:
  type: json
  content: "{\r\n  \"idCategoria\": {{categoriaId}},\r\n  \"idSubCategoria\": {{subCategoriaId}}\r\n}"
scripts:
  - type: afterResponse
    code: "const r = pm.response.json();\r\nif (pm.response.code === 200) {\r\n  console.log('SubCategoria desvinculada com sucesso');\r\n} else {\r\n  console.log('Erro desvincular:', pm.response.status, JSON.stringify(r));\r\n}"
    language: text/javascript
order: 310
