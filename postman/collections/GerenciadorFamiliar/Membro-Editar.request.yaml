$kind: http-request
name: Editar Membro
url: "{{baseUrl}}/api/Membro"
method: PUT
body:
  type: json
  content: "{\r\n  \"id\": {{membroId}},\r\n  \"nome\": \"Pedro Editado\"\r\n}"
scripts:
  - type: afterResponse
    code: "const r = pm.response.json();\r\nif (pm.response.code === 200) {\r\n  console.log('Membro editado com sucesso');\r\n} else {\r\n  console.log('Erro editar membro:', pm.response.status, JSON.stringify(r));\r\n}"
    language: text/javascript
order: 170
