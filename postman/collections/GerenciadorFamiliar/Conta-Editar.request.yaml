$kind: http-request
name: Editar Conta
url: "{{baseUrl}}/api/Conta/{{contaId}}"
method: PUT
body:
  type: json
  content: "{\r\n  \"nome\": \"Conta Corrente Editada\"\r\n}"
scripts:
  - type: afterResponse
    code: "const r = pm.response.json();\r\nif (pm.response.code === 200) {\r\n  console.log('Conta editada com sucesso');\r\n} else {\r\n  console.log('Erro editar conta:', pm.response.status, JSON.stringify(r));\r\n}"
    language: text/javascript
order: 100
