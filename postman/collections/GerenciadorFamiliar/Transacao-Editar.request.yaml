$kind: http-request
name: Editar Transacao
url: "{{baseUrl}}/api/Transacao/{{transacaoId}}"
method: PUT
body:
  type: json
  content: "{\r\n  \"descricao\": \"Supermercado Editado\",\r\n  \"status\": 1\r\n}"
scripts:
  - type: afterResponse
    code: "const r = pm.response.json();\r\nif (pm.response.code === 200) {\r\n  console.log('Transacao editada com sucesso');\r\n} else {\r\n  console.log('Erro editar transacao:', pm.response.status, JSON.stringify(r));\r\n}"
    language: text/javascript
order: 150
